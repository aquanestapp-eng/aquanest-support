<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="Content-Language" content="ja">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaNest Support</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4fbfc;
      --surface: #ffffff;
      --text: #16333a;
      --muted: #5e7a80;
      --accent: #2f9fb3;
      --line: #d4e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
      background: linear-gradient(180deg, #eef9fb 0%, var(--bg) 100%);
      color: var(--text);
      line-height: 1.7;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(27, 67, 76, 0.06);
    }

    h1, h2 {
      line-height: 1.3;
      margin: 0 0 12px;
    }

    h1 {
      font-size: 32px;
    }

    p, li {
      font-size: 16px;
      margin: 0 0 12px;
    }

    ul {
      padding-left: 20px;
      margin: 0;
    }

    a {
      color: var(--accent);
    }

    .muted {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>AquaNest Support Pages</h1>
      <p class="muted">
        「水分補給レコード」のサポート情報、プライバシーポリシー、利用規約を公開するためのページです。
      </p>
      <ul>
        <li><a href="./support.html">サポートページ</a></li>
        <li><a href="./privacy.html">プライバシーポリシー</a></li>
        <li><a href="./terms.html">利用規約</a></li>
      </ul>
    </section>
  </main>
</body>
</html>
